<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 단어 학습장</title>
<style>
  body {
    background-color: #121212;
    color: #ffffff;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
    word-break: keep-all;
  }
  .card {
    background-color: #333333;
    border-radius: 15px;
    padding: 30px 20px;
    margin-bottom: 30px;
    width: 100%;
    max-width: 500px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.5);
  }
  .en-text {
    font-size: 3.5rem;
    font-weight: bold;
    margin-bottom: 10px;
    display: block;
  }
  .ko-text {
    font-size: 2.5rem;
    font-weight: bold;
    color: #ffeb3b;
    display: block;
  }
  .sentence-en {
    font-size: 2.2rem;
    font-weight: bold;
    margin-bottom: 15px;
    display: block;
  }
  .sentence-ko {
    font-size: 1.8rem;
    font-weight: bold;
    color: #4dd0e1;
    display: block;
  }
  .nav-area {
    display: flex;
    gap: 20px;
  }
  button {
    font-size: 1.8rem;
    font-weight: bold;
    padding: 15px 30px;
    background-color: #4caf50;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .instruction {
    font-size: 1.2rem;
    color: #aaaaaa;
    margin-bottom: 15px;
  }
</style>
</head>
<body>

  <div class="instruction">화면의 단어나 문장을 누르면 소리가 납니다.</div>

  <div id="word-card" class="card" tabindex="0" aria-label="단어 영역입니다. 누르면 소리가 납니다.">
    <span id="word-en" class="en-text"></span>
    <span id="word-ko" class="ko-text"></span>
  </div>

  <div id="sentence-card" class="card" tabindex="0" aria-label="예문 영역입니다. 누르면 소리가 납니다.">
    <span id="sentence-en" class="sentence-en"></span>
    <span id="sentence-ko" class="sentence-ko"></span>
  </div>

  <div class="nav-area">
    <button id="btn-prev">이전</button>
    <button id="btn-next">다음</button>
  </div>

  let currentIndex = 0;
  let wordClickCount = 0;
  let sentClickCount = 0;
  
  // 안드로이드 가비지 컬렉션 방지를 위한 전역 변수 설정
  let currentUtterance = null;
  let availableVoices = [];

  const wordEnText = document.getElementById("word-en");
  const wordKoText = document.getElementById("word-ko");
  const sentEnText = document.getElementById("sentence-en");
  const sentKoText = document.getElementById("sentence-ko");

  // 안드로이드 지연 로딩 대비 기기 음성 목록 미리 불러오기
  function loadVoices() {
    availableVoices = window.speechSynthesis.getVoices();
  }
  loadVoices();
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function updateDisplay() {
    const item = wordData[currentIndex];
    wordEnText.textContent = item.en;
    wordKoText.textContent = item.ko;
    sentEnText.textContent = item.exEn;
    sentKoText.textContent = item.exKo;
    
    wordClickCount = 0;
    sentClickCount = 0;
  }

  function speakText(text, lang) {
    // 안드로이드 연속 취소 버그 방지: 현재 말하고 있을 때만 취소
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
    }

    currentUtterance = new SpeechSynthesisUtterance(text);
    currentUtterance.lang = lang;
    currentUtterance.rate = 0.9;
    
    // 기기에 적합한 목소리를 강제로 찾아 연결하여 호환성 강화
    if (availableVoices.length > 0) {
      const targetVoice = availableVoices.find(voice => voice.lang.includes(lang) || voice.lang.includes(lang.replace('-', '_')));
      if (targetVoice) {
        currentUtterance.voice = targetVoice;
      }
    }

    window.speechSynthesis.speak(currentUtterance);
  }

  document.getElementById("word-card").addEventListener("click", () => {
    const item = wordData[currentIndex];
    if (wordClickCount % 2 === 0) {
      speakText(item.en, "en-US");
    } else {
      speakText(item.ko, "ko-KR");
    }
    wordClickCount++;
  });

  document.getElementById("sentence-card").addEventListener("click", () => {
    const item = wordData[currentIndex];
    if (sentClickCount % 2 === 0) {
      speakText(item.exEn, "en-US");
    } else {
      speakText(item.exKo, "ko-KR");
    }
    sentClickCount++;
  });

  document.getElementById("btn-prev").addEventListener("click", () => {
    if (currentIndex > 0) {
      currentIndex--;
      updateDisplay();
    }
  });

  document.getElementById("btn-next").addEventListener("click", () => {
    if (currentIndex < wordData.length - 1) {
      currentIndex++;
      updateDisplay();
    }
  });

  updateDisplay();
</script>
</body>
</html>
